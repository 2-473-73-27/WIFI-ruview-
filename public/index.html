<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Well Come to SA!R Hosting</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1, h2 { color: #00d2ff; }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #00d2ff;
      border: none;
      color: #121212;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #0099cc; color: #fff; }
    .hidden { display: none; }
    .link-box {
      background: #2a2a2a;
      padding: 10px;
      margin-top: 15px;
      border-radius: 4px;
      word-break: break-all;
      border: 1px solid #00d2ff;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- LOGIN PAGE -->
  <div id="login-page">
    <h1>Well Come to SA!R Hosting</h1>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashboard-page" class="hidden">
    <h2>SA!R Hosting Dashboard</h2>
    <input type="text" id="ip-link" placeholder="Enter IP / Domain">
    <input type="file" id="file-input" accept=".html,.sh">
    <button onclick="uploadFile()">Upload</button>

    <div id="hosting-section" class="hidden">
      <h3>Hosting Output</h3>
      <div class="link-box"><a id="public-link" href="#" target="_blank">View File</a></div>
    </div>
  </div>
</div>

<script>
  function login() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    if (user && pass) {
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('dashboard-page').classList.remove('hidden');
    } else {
      alert("Please enter credentials.");
    }
  }

  function uploadFile() {
    const fileInput = document.getElementById('file-input');
    if (fileInput.files.length === 0) {
      alert("Please select a file first.");
      return;
    }
    const fileName = fileInput.files[0].name;
    document.getElementById('hosting-section').classList.remove('hidden');
    const link = document.getElementById('public-link');
    link.innerText = "Loaded: " + fileName;
    link.href = "#";
  }
</script>

</body>
  </html>
