<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Well Come to SA!R Hosting</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h1, h2 { text-align: center; color: #38bdf8; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0284c7; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .hidden { display: none; }
    .result { background: #0f172a; padding: 12px; margin-top: 15px; border-radius: 6px; border: 1px solid #38bdf8; word-break: break-all; }
    .result a { color: #38bdf8; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <div id="login-box">
    <h1>Well Come to SA!R Hosting</h1>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="dash-box" class="hidden">
    <h2>SA!R Hosting Dashboard</h2>
    <input type="text" id="ip-link" placeholder="Enter IP Link (e.g. 62.833.88.32)">
    <input type="file" id="file-input" accept=".html,.sh">
    <button onclick="upload()">Upload & Generate Link</button>

    <div id="result-box" class="hidden result">
      <span>Generated Link:</span><br>
      <a id="out-link" href="#" target="_blank">---</a>
    </div>
  </div>
</div>

<script>
  function login() {
    if (document.getElementById('username').value && document.getElementById('password').value) {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('dash-box').classList.remove('hidden');
    } else alert('Enter credentials');
  }

  async function upload() {
    const file = document.getElementById('file-input').files[0];
    if (!file) return alert('Select a file');

    const data = new FormData();
    data.append('file', file);
    data.append('ipLink', document.getElementById('ip-link').value);

    const res = await fetch('/api/upload', { method: 'POST', body: data });
    const json = await res.json();

    if (json.success) {
      document.getElementById('result-box').classList.remove('hidden');
      const a = document.getElementById('out-link');
      a.href = json.url;
      a.innerText = json.url;
    }
  }
</script>

</body>
</html>
