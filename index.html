<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Network Diagnostics</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #0284c7;
            --success-color: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .metric-card {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-title {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .metric-value {
            font-size: 1rem;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success-color);
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Network Diagnostics</h2>
        <p class="subtitle">Local connection state for this session.</p>

        <div class="metric-card">
            <span class="metric-title">Connection Status</span>
            <span class="status-badge" id="onlineStatus">Online</span>
        </div>

        <div class="metric-card">
            <span class="metric-title">Effective Network Type</span>
            <span class="metric-value" id="networkType">Checking...</span>
        </div>

        <div class="metric-card">
            <span class="metric-title">Estimated Downlink</span>
            <span class="metric-value" id="downlinkSpeed">Checking...</span>
        </div>

        <div class="metric-card">
            <span class="metric-title">Round-Trip Time (RTT)</span>
            <span class="metric-value" id="rttLatency">Checking...</span>
        </div>

        <button class="btn" onclick="refreshMetrics()">Run Speed Test / Refresh</button>
    </div>

    <script>
        function refreshMetrics() {
            const statusBadge = document.getElementById('onlineStatus');
            const networkType = document.getElementById('networkType');
            const downlinkSpeed = document.getElementById('downlinkSpeed');
            const rttLatency = document.getElementById('rttLatency');

            // Check basic online status
            if (navigator.onLine) {
                statusBadge.textContent = "Online";
                statusBadge.style.backgroundColor = "rgba(34, 197, 94, 0.2)";
                statusBadge.style.color = "#22c55e";
            } else {
                statusBadge.textContent = "Offline";
                statusBadge.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
                statusBadge.style.color = "#ef4444";
            }

            // Access Network Information API if supported by browser
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

            if (conn) {
                networkType.textContent = conn.effectiveType ? conn.effectiveType.toUpperCase() : "Unknown";
                downlinkSpeed.textContent = conn.downlink ? `${conn.downlink} Mbps` : "N/A";
                rttLatency.textContent = conn.rtt ? `${conn.rtt} ms` : "N/A";
            } else {
                networkType.textContent = "API Not Supported";
                downlinkSpeed.textContent = "N/A";
                rttLatency.textContent = "N/A";
            }
        }

        // Run on page load
        window.addEventListener('load', refreshMetrics);
        window.addEventListener('online', refreshMetrics);
        window.addEventListener('offline', refreshMetrics);
    </script>
</body>
                </html>
